kind: channel
version: 1
id: slack
name: Slack

capabilities:
  threads: true
  files: true
  reactions: true
  edits: true
  max_message_length: 4000
  response_format: slack

# Credentials are read from per-instance config (see README) so a single
# opentalon process can host multiple Slack bots, each with its own
# workspace credentials. The {{config.*}} templates below pull from the
# `channels.<name>.config` block in opentalon's config.yaml — values there
# still support ${ENV_VAR} expansion, so secrets stay in env vars.

init:
  - name: auth_test
    method: POST
    url: https://slack.com/api/auth.test
    headers:
      Authorization: "Bearer {{config.bot_token}}"
    store:
      bot_user_id: "user_id"

  - name: connect
    method: POST
    url: https://slack.com/api/apps.connections.open
    headers:
      Authorization: "Bearer {{config.app_token}}"
    store:
      ws_url: "url"

connection:
  url: "{{self.ws_url}}"
  reconnect:
    enabled: true
    backoff_initial: 1s
    backoff_max: 30s
    re_init: [connect]

inbound:
  ack:
    when: "envelope_id"
    send: '{"envelope_id":"{{frame.envelope_id}}"}'

  event_path: "payload.event"
  event_types: [app_mention]
  always_process_when:
    field: "channel_type"
    equals: "im"

  skip:
    - field: "user"
      equals: "{{self.bot_user_id}}"
    - field: "bot_id"
      not_empty: true
    - field: "subtype"
      not_empty: true
      except: [thread_broadcast, file_share]

  # Per-message enrichment: look up the sender's Slack profile (email,
  # display name) and expose it under {{enrich.user.*}} so the metadata
  # mapping below can surface it on every InboundMessage. Cached by sender
  # ID for 1h to keep users.info quota usable on busy workspaces. Requires
  # the Slack app to have the `users:read.email` scope.
  enrich:
    user:
      method: POST
      url: https://slack.com/api/users.info
      headers:
        Authorization: "Bearer {{config.bot_token}}"
        Content-Type: application/x-www-form-urlencoded
      body: "user={{event.user}}"
      extract:
        email: "user.profile.email"
        real_name: "user.real_name"
      cache:
        key: "{{event.user}}"
        ttl: 1h

  mapping:
    conversation_id: "channel"
    sender_id: "user"
    content: "text"
    thread_id:
      field: "thread_ts"
      fallback: "ts"
    metadata:
      ts: "ts"
      profile_token: "user"
      channel_id: "{{self.bot_user_id}}"
      user_email: "{{enrich.user.email}}"
      user_name: "{{enrich.user.real_name}}"

  media:
    - when: "files"
      resolve:
        mime_type: "{{event.files.0.mimetype}}"
        name: "{{event.files.0.name}}"
        steps:
          - url: "{{event.files.0.url_private}}"
            headers:
              Authorization: "Bearer {{config.bot_token}}"

  transforms:
    - type: replace
      pattern: "<@{{self.bot_user_id}}>"
      replacement: ""
    - type: trim

  dedup:
    key: "{{event.channel}}:{{event.ts}}"
    ttl: 10m

outbound:
  chunking:
    max_length: 4000
  send:
    method: POST
    url: https://slack.com/api/chat.postMessage
    headers:
      Authorization: "Bearer {{config.bot_token}}"
      Content-Type: application/json
    body: '{"channel":"{{msg.conversation_id}}","text":"{{msg.content}}","thread_ts":"{{msg.thread_id}}","mrkdwn":true}'
  send_store_id: "ts"
  update:
    method: POST
    url: https://slack.com/api/chat.update
    headers:
      Authorization: "Bearer {{config.bot_token}}"
      Content-Type: application/json
    body: '{"channel":"{{msg.conversation_id}}","ts":"{{msg.message_id}}","text":"{{msg.content}}","mrkdwn":true}'

hooks:
  on_receive:
    - method: POST
      url: https://slack.com/api/reactions.add
      headers:
        Authorization: "Bearer {{config.bot_token}}"
        Content-Type: application/json
      body: '{"channel":"{{event.conversation_id}}","timestamp":"{{event.metadata.ts}}","name":"{{config.ack_reaction}}"}'
      when: "{{config.ack_reaction}}"
  on_response:
    - method: POST
      url: https://slack.com/api/reactions.remove
      headers:
        Authorization: "Bearer {{config.bot_token}}"
        Content-Type: application/json
      body: '{"channel":"{{msg.conversation_id}}","timestamp":"{{msg.metadata.ts}}","name":"{{config.ack_reaction}}"}'
      when: "{{config.ack_reaction}}"
    - method: POST
      url: https://slack.com/api/reactions.add
      headers:
        Authorization: "Bearer {{config.bot_token}}"
        Content-Type: application/json
      body: '{"channel":"{{msg.conversation_id}}","timestamp":"{{msg.metadata.ts}}","name":"{{config.done_reaction}}"}'
      when: "{{config.done_reaction}}"

tools_file: tools.yaml
